<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Flipbook</title>
    <link rel="stylesheet" href="book.css" />
    <script src="page-flip.browser.js"></script>
  </head>
  <body>
    <!-- Home Button -->
    <a href="../index.html" class="home-button" aria-label="Go to home page">
      <img src="images/back.png" alt="Home" />
    </a>

    <div class="book-container">
      <div class="book-wrapper">
        <div id="book">
          <div class="page" data-density="hard">
            <img src="images/cover_page.png" alt="Cover Page" />
          </div>
          <div class="page">
            <img src="images/Page_1_revised.png" alt="Page 1" />
          </div>
          <div class="page">
            <img src="images/Page_2_v2.png" alt="Page 2" />
          </div>
          <div class="page">
            <img src="images/Page_3.png" alt="Page 3" />
          </div>
          <div class="page">
            <img src="images/Page_4.png" alt="Page 4" />
          </div>
          <div class="page">
            <img src="images/Page_5.png" alt="Page 5" />
          </div>
          <div class="page">
            <img src="images/Page_6_v2.png" alt="Page 6" />
          </div>
          <div class="page">
            <img src="images/Page_7_v3.png" alt="Page 7" />
          </div>
          <div class="page">
            <img src="images/Page_8.png" alt="Page 8" />
          </div>
          <div class="page">
            <img src="images/Page_9_v2.png" alt="Page 9" />
          </div>
          <div class="page">
            <img src="images/Page_10_v2.png" alt="Page 10" />
          </div>
          <div class="page" data-density="hard">
            <img src="images/Back_page_v2.png" alt="Back Page" />
          </div>
        </div>
      </div>

      <!-- Page Indicator -->
      <div class="page-indicator" id="pageIndicator">
        <span id="currentPage">1</span> / <span id="totalPages">12</span>
      </div>
    </div>

    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const pageFlip = new St.PageFlip(document.getElementById('book'), {
          width: 360,
          height: 425,
          size: 'stretch',
          minWidth: 350,
          maxWidth: 700,
          minHeight: 400,
          maxHeight: 800,
          showCover: true,
          mobileScrollSupport: false,
        });

        pageFlip.loadFromHTML(document.querySelectorAll('#book .page'));

        // elements for page indicator
        const currentPageSpan = document.getElementById('currentPage');
        const totalPagesSpan = document.getElementById('totalPages');

        // set total pages
        const totalPages = document.querySelectorAll('#book .page').length;
        totalPagesSpan.textContent = totalPages;

        // page indicator counter
        function updateNavigation() {
          const currentPage = pageFlip.getCurrentPageIndex();
          currentPageSpan.textContent = Math.floor(currentPage / 2) + 1;
        }

        // desktop keyboard controls
        document.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowRight') pageFlip.flipNext();
          if (e.key === 'ArrowLeft') pageFlip.flipPrev();
        });

        // listen for page flip events
        pageFlip.on('flip', updateNavigation);
        pageFlip.on('changeOrientation', updateNavigation);
        pageFlip.on('changeState', updateNavigation);


        updateNavigation();
      });
    </script>
  </body>
</html>
